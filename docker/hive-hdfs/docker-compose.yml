name: nl2sql-bigdata

services:
  namenode:
    image: apache/hadoop:3.4.1
    hostname: namenode
    command: ["hdfs", "namenode"]
    ports:
      - "8020:8020"   # HDFS RPC（Hive 客户端连此）
      - "9870:9870"   # NameNode Web UI + WebHDFS
    environment:
      ENSURE_NAMENODE_DIR: /data/dfs/name
      CORE-SITE.XML_fs.defaultFS: hdfs://namenode:8020
      HDFS-SITE.XML_dfs.namenode.name.dir: /data/dfs/name
      HDFS-SITE.XML_dfs.replication: "1"
      HDFS-SITE.XML_dfs.permissions.enabled: "false"
    volumes:
      - nn-data:/data
      - ./data:/host-data:ro
    networks: [nl2sql-bigdata]

  datanode:
    image: apache/hadoop:3.4.1
    hostname: datanode
    command: ["hdfs", "datanode"]
    depends_on: [namenode]
    ports:
      - "9864:9864"   # DataNode Web UI
    environment:
      WAITFOR: namenode:8020
      CORE-SITE.XML_fs.defaultFS: hdfs://namenode:8020
      HDFS-SITE.XML_dfs.datanode.data.dir: /data/dfs/data
      HDFS-SITE.XML_dfs.replication: "1"
      HDFS-SITE.XML_dfs.permissions.enabled: "false"
    volumes:
      - dn-data:/data
    networks: [nl2sql-bigdata]

  hive:
    image: apache/hive:4.0.1
    hostname: hive
    depends_on: [namenode, datanode]
    ports:
      - "10000:10000" # HiveServer2（JDBC / beeline）
      - "10002:10002" # HiveServer2 Web UI
    environment:
      SERVICE_NAME: hiveserver2
      HIVE_CUSTOM_CONF_DIR: /hive-custom-conf
    volumes:
      - ./conf:/hive-custom-conf:ro
      # bind mount：容器内 hive(uid 1000) 对镜像内 /opt/hive/data（root 属主）无写权限，
      # Derby 元数据库落此处；Windows bind mount 属主映射宽松且数据可见
      - ./hive-data:/opt/hive/data
    networks: [nl2sql-bigdata]

volumes:
  nn-data:
  dn-data:

networks:
  nl2sql-bigdata:
    name: nl2sql-bigdata
