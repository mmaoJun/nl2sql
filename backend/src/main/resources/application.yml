server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: nl2sql-backend

  # SSE 流式接口（/api/v1/chat/stream）的异步请求超时兜底（5 分钟）；
  # 不设置时走容器默认（Tomcat 30s），长问答会被提前掐断
  mvc:
    async:
      request-timeout: 300000

  # MySQL - 后端元数据库
  datasource:
    url: jdbc:mysql://localhost:3306/nlp2sql_meta?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: "050407"
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  # Redis
  data:
    redis:
      host: localhost
      port: 6379
      password: "050407"
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

  # Jackson
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.nl2sql.model
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置
jwt:
  secret: nlp2sql-jwt-secret-key-2024-must-be-at-least-256-bits-long-for-hs256
  expiration: 86400000  # 24小时

# 本项目业务配置
nl2sql:
  # SQL 安全配置
  sql-security:
    max-limit: 100
    query-timeout-seconds: 10
    max-retry: 2

  # Schema 缓存配置
  schema-cache:
    ttl-seconds: 3600

  # 会话记忆配置（T11）：多轮追问时从 chat_turns 注入历史
  memory:
    # 上下文窗口轮数：最多注入同会话同数据源的最近几轮（数值同旧项目 nlp2sql.memory.context-turns）
    context-turns: 3

  # 模型通道配置（双轨：本地 Ollama 默认，云端 DashScope 可选）
  model:
    # 云端 DashScope API Key：从环境变量注入，缺省为空串（缺 key 不阻塞启动）
    dashscope-api-key: ${DASHSCOPE_API_KEY:}
    cloud-model: qwen-plus
    # Ollama 服务地址（不含 /v1，装配时自动补全 /v1/chat/completions）
    ollama-base-url: http://localhost:11434
    local-model: qwen2.5-coder:7b
    # 本地模型采样温度：0.8（Ollama 默认）下工具调用格式不稳定，实测取 0.1
    local-temperature: 0.1
    # ReActAgent 默认装配的通道: local | cloud
    provider: local

# SpringDoc OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# 日志
logging:
  level:
    com.nl2sql: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{traceId}] %-5level %logger{36} - %msg%n"
